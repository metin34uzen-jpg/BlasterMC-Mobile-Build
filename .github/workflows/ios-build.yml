name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BlasterMCMobile/**'
      - 'branding/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-realm-v13-builds
  cancel-in-progress: true

jobs:
  build-and-package:
    # Private mirrors never consume paid/minuted Actions; run on public only.
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Python image tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate original gold B icon
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/make_assets.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify simulator build
        run: |
          xcodebuild -project BlasterMCMobile.xcodeproj \
            -scheme BlasterMCMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild -project BlasterMCMobile.xcodeproj \
            -scheme BlasterMCMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BlasterMCMobile.app Payload/
          zip -qr BlasterMCMobile-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlasterMCMobile-unsigned-IPA
          path: BlasterMCMobile-unsigned.ipa
          if-no-files-found: error
